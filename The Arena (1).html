<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
/* Layout: one tall column. Opponent board on top, a thin phase band between, your board below, then actions and hand. Sheets slide up from the bottom. */
:root {
  --ground: #12151b; --panel: #1a1e27; --panel2: #232836; --line: #333a49;
  --floor1: #3a2b20; --floor2: #1f1712;
  --ink: #ebe4d2; --dim: #a69e8b; --brass: #cba54b; --brass-d: #8d7433;
  --bone: #ddd6c3; --bone-ink: #272017;
  --equip: #a9822f; --action: #a3452e; --effect: #3a6896; --trap: #764a8b; --token: #646c7a;
  --good: #6fb06a; --bad: #e0614a;
  --f-display: 'IM Fell English SC', Georgia, 'Times New Roman', serif;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-cond: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font: 14px/1.35 var(--f-body); overflow-x: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
#app { min-height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 14px; }
.screen[hidden] { display: none; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .02em; }
.cond { font-family: var(--f-cond); letter-spacing: .08em; text-transform: uppercase; }

/* ---------- menu ---------- */
#menu { display: flex; flex-direction: column; gap: 18px; padding-block: 18px 8px; }
.logo h1 { font-size: 52px; line-height: .95; letter-spacing: .06em; color: var(--ink); }
.logo p { margin: 8px 0 0; color: var(--dim); font-family: var(--f-cond); letter-spacing: .14em; text-transform: uppercase; font-size: 12px; }
.sect > .lab { font-family: var(--f-cond); letter-spacing: .14em; text-transform: uppercase; font-size: 12px; color: var(--dim); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; }
.lab button { background: none; border: 0; color: var(--brass); font-size: 12px; text-decoration: underline; padding: 2px 0; }
.picks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.pick { --hue: #888; background: color-mix(in srgb, var(--hue) 14%, var(--panel)); border: 1px solid color-mix(in srgb, var(--hue) 40%, var(--line)); border-radius: 6px; padding: 10px 2px 9px; text-align: center; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pick b { font-family: var(--f-display); font-weight: 400; font-size: 14px; }
.pick small { font-family: var(--f-cond); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); line-height: 1.1; }
.pick[aria-pressed="true"] { border-color: var(--brass); background: color-mix(in srgb, var(--hue) 34%, var(--panel)); box-shadow: 0 0 0 1px var(--brass); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 3px; }
.seg button { background: none; border: 0; border-radius: 5px; padding: 9px 4px; font-size: 13px; color: var(--dim); }
.seg button[aria-pressed="true"] { background: var(--panel2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--brass-d); }
.bigbtn { background: var(--brass); color: #20180b; border: 0; border-radius: 7px; padding: 14px; font-family: var(--f-display); font-size: 20px; letter-spacing: .06em; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ghost { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 11px 8px; font-size: 13px; }
.foot { color: var(--dim); font-size: 12px; margin: 0; }

/* ---------- game ---------- */
#game { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 30px; }
.topbar .tt { font-family: var(--f-cond); letter-spacing: .1em; text-transform: uppercase; font-size: 12.5px; color: var(--dim); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .tb { display: flex; gap: 6px; }
.tbtn { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 5px 10px; font-size: 12px; font-family: var(--f-cond); letter-spacing: .08em; text-transform: uppercase; }
.zone { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 10px; background: radial-gradient(120% 140% at 50% 50%, var(--floor1), var(--floor2)); border: 1px solid #4a382a; }
.plate { --hue: #888; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; text-align: left; width: 100%; background: color-mix(in srgb, var(--hue) 16%, #16130f); border: 1px solid color-mix(in srgb, var(--hue) 45%, #2a2118); border-radius: 7px; padding: 7px 10px; }
.plate.turn { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass); }
.who { display: flex; flex-direction: column; min-width: 0; }
.who b { font-family: var(--f-display); font-weight: 400; font-size: 17px; line-height: 1.05; }
.who small { font-family: var(--f-cond); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hpw { display: flex; align-items: center; gap: 8px; }
.bar { width: 92px; height: 9px; background: #0d0b09; border-radius: 5px; overflow: hidden; border: 1px solid #000; }
.bar i { display: block; height: 100%; background: var(--hue); transition: width .5s ease; }
.hpn { font-family: var(--f-cond); font-weight: 700; font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; }
.hpn small { font-size: 12px; color: var(--dim); font-weight: 500; }
.chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-family: var(--f-cond); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; padding: 2px 7px; border-radius: 10px; background: rgba(0,0,0,.35); color: var(--dim); border: 1px solid rgba(255,255,255,.07); white-space: nowrap; }
.chip.hot { color: #f0d9a0; border-color: var(--brass-d); }
.chip.bad { color: #f0b3a6; border-color: #7b3a2d; }
.board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
.slot { position: relative; aspect-ratio: 5 / 6; border-radius: 6px; border: 1px dashed rgba(235,228,210,.2); background: rgba(0,0,0,.22); display: grid; place-items: center; min-width: 0; }
.slot:nth-child(2n+3) { }
.slot .lbl { font-family: var(--f-cond); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: rgba(235,228,210,.38); }
.slot.wild { border-style: dashed; }

/* ---------- cards ---------- */
.card { --tc: var(--equip); position: relative; background: var(--bone); color: var(--bone-ink); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; text-align: left; border: 0; padding: 0; min-width: 0; box-shadow: 0 1px 0 rgba(0,0,0,.5); }
.card.t-equip { --tc: var(--equip); } .card.t-action { --tc: var(--action); } .card.t-effect { --tc: var(--effect); } .card.t-trap { --tc: var(--trap); } .card.t-tok { --tc: var(--token); }
.card .hd { background: var(--tc); color: #fbf6e8; font-family: var(--f-cond); font-weight: 600; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; padding: 2px 5px; display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.card .nm { font-family: var(--f-display); font-size: 11px; line-height: 1.08; padding: 4px 5px 0; text-wrap: balance; }
.card .tx { font-size: 9.5px; line-height: 1.2; padding: 3px 5px 0; color: #4a4030; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.card .st { margin-top: auto; display: flex; gap: 6px; padding: 2px 5px 4px; }
.card .st span { font-family: var(--f-cond); font-size: 8.5px; letter-spacing: .08em; color: #5c513e; display: flex; align-items: baseline; gap: 2px; }
.card .st em { font-style: normal; font-weight: 700; font-size: 15px; color: var(--bone-ink); line-height: 1; font-variant-numeric: tabular-nums; }
.card .cost { background: #1c2a3c; color: #bcd6f5; border-radius: 8px; padding: 0 5px; font-size: 10px; line-height: 14px; }
.slot > .card { position: absolute; inset: 0; width: 100%; height: 100%; }
.card.tok { background: repeating-linear-gradient(135deg, #cfc8b4 0 6px, #c3bba5 6px 12px); }
.card.back { background: repeating-linear-gradient(45deg, #2a2132 0 5px, #34283e 5px 10px); border: 1px solid var(--trap); align-items: center; justify-content: center; }
.card.back span { font-family: var(--f-cond); letter-spacing: .16em; font-size: 10px; color: #b99ccb; text-transform: uppercase; }
.card.set .hd::after { content: 'SET'; opacity: .85; }
.card.can { outline: 2px solid var(--brass); outline-offset: 1px; animation: pulse 1.4s ease-in-out infinite; }
.card.dim { opacity: .5; }
@keyframes pulse { 50% { outline-color: rgba(203,165,75,.35); } }
@media (prefers-reduced-motion: reduce) { .card.can { animation: none; } .bar i { transition: none; } }

/* ---------- mid band ---------- */
.mid { display: flex; flex-direction: column; gap: 6px; padding: 2px 2px; }
.phases { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.phases span { text-align: center; font-family: var(--f-cond); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; padding: 3px 0; border-radius: 4px; background: var(--panel); color: var(--dim); }
.phases span.on { background: var(--brass); color: #20180b; font-weight: 700; }
.ticker { margin: 0; padding: 0; list-style: none; font-size: 12px; line-height: 1.3; color: var(--dim); min-height: 48px; width: 100%; background: none; border: 0; text-align: left; display: block; }
.ticker .tk { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ticker .tk:last-child { color: var(--ink); }
.ticker .dmg { color: #f0a392; } .ticker .heal { color: #a5d6a0; } .ticker .trap { color: #cdaee0; } .ticker .abil { color: #f0d9a0; } .ticker .turn { color: var(--brass); }

/* ---------- actions & hand ---------- */
.actbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 46px; flex-wrap: wrap; }
.actbar .msg { font-size: 13px; color: var(--dim); flex: 1 1 120px; min-width: 0; }
.actbar .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.abtn { background: var(--panel2); border: 1px solid var(--brass-d); border-radius: 6px; padding: 9px 12px; font-size: 13px; }
.abtn.primary { background: var(--brass); color: #20180b; border-color: var(--brass); font-weight: 600; }
.abtn:disabled { opacity: .45; }
.hand { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
.hand .card { flex: 0 0 94px; height: 132px; scroll-snap-align: start; cursor: pointer; }
.hand .empty { color: var(--dim); font-size: 13px; padding: 10px 0; }

/* ---------- sheets, modal ---------- */
.veil { position: fixed; inset: 0; background: rgba(5,6,9,.62); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.veil[hidden] { display: none; }
.sheet { width: 100%; max-width: 560px; max-height: 86%; overflow-y: auto; background: var(--panel); border-top: 1px solid var(--brass-d); border-radius: 14px 14px 0 0; padding: 16px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.sheet h2 { font-size: 24px; }
.sheet .sub { color: var(--dim); font-size: 13px; margin: -6px 0 0; }
.sheet p { margin: 0; }
.sheet .x { align-self: flex-end; background: none; border: 0; color: var(--dim); font-size: 13px; padding: 0; margin-bottom: -6px; text-decoration: underline; }
.dlgveil { align-items: center; padding: 16px; z-index: 30; }
.dlg { width: 100%; max-width: 440px; max-height: 90%; overflow-y: auto; background: var(--panel); border: 1px solid var(--brass-d); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.dlg h3 { font-size: 22px; }
.dlg p { margin: 0; color: var(--dim); }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; align-items: center; gap: 10px; text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; min-width: 0; }
.opt:hover { border-color: var(--brass-d); }
.opt .card { flex: 0 0 74px; height: 100px; }
.opt > span { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.opt small { color: var(--dim); font-size: 12px; }
.revealrow { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.revealrow .card { flex: 0 0 84px; height: 116px; }
.bigcard { align-self: center; width: min(62vw, 230px); aspect-ratio: 5 / 7; box-shadow: 0 6px 22px rgba(0,0,0,.5); border-radius: 10px; }
.bigcard .hd { font-size: 12px; padding: 4px 9px; }
.bigcard .nm { font-size: 22px; padding: 10px 10px 0; }
.bigcard .tx { font-size: 14px; line-height: 1.3; padding: 8px 10px 0; -webkit-line-clamp: 9; }
.bigcard .st { padding: 4px 10px 10px; gap: 12px; }
.bigcard .st span { font-size: 11px; } .bigcard .st em { font-size: 26px; }
.note { background: var(--panel2); border-radius: 7px; padding: 9px 11px; font-size: 13px; color: var(--dim); }
.kv { display: grid; grid-template-columns: 1fr auto auto; gap: 5px 14px; font-size: 13px; align-items: baseline; }
.kv .h { font-family: var(--f-cond); letter-spacing: .1em; text-transform: uppercase; font-size: 11px; color: var(--dim); }
.kv .n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.loglist { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.loglist .t { font-family: var(--f-cond); letter-spacing: .12em; text-transform: uppercase; font-size: 11px; color: var(--brass); margin-top: 8px; }
.loglist .dmg { color: #f0a392; } .loglist .heal { color: #a5d6a0; } .loglist .trap { color: #cdaee0; } .loglist .abil { color: #f0d9a0; } .loglist .atk { color: var(--ink); } .loglist div { color: var(--dim); }
.decklist { display: flex; flex-direction: column; gap: 6px; }
.decklist .r { display: grid; grid-template-columns: 30px 1fr; gap: 8px; font-size: 13px; align-items: baseline; }
.decklist .r b { font-family: var(--f-cond); font-size: 16px; color: var(--brass); }
.decklist .r span small { color: var(--dim); display: block; font-size: 12px; }
.tablewrap { overflow-x: auto; }
table.mx { border-collapse: separate; border-spacing: 2px; font-family: var(--f-cond); font-size: 13px; min-width: 100%; }
table.mx th { font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 11px; color: var(--dim); padding: 3px 4px; text-align: center; }
table.mx th.rh { text-align: left; }
table.mx td { text-align: center; padding: 7px 4px; border-radius: 4px; font-variant-numeric: tabular-nums; min-width: 44px; }
.prog { height: 6px; background: #0d0b09; border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--brass); transition: width .2s; }
textarea.rep { width: 100%; min-height: 120px; background: #0f1218; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; font: 12px/1.4 ui-monospace, Menlo, monospace; padding: 8px; resize: vertical; }
select { background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 7px 8px; font: inherit; }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
.fl { position: absolute; font-family: var(--f-cond); font-weight: 700; font-size: 30px; transform: translate(-50%, 0); animation: rise 1s ease-out forwards; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
.fl.dmg { color: #ff8b73; } .fl.heal { color: #9ee08f; }
@keyframes rise { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -46px; } }
@media (prefers-reduced-motion: reduce) { .fl { animation: none; opacity: .9; } }
@media (min-width: 640px) { .veil { align-items: center; } .sheet { border-radius: 14px; border: 1px solid var(--brass-d); } .slot .lbl { font-size: 11px; } }
</style>

<div id="app">
  <main id="menu" class="screen">
    <div class="logo"><h1>The Arena</h1><p>Prototype v0.1 · working ruleset</p></div>
    <div class="sect"><div class="lab"><span>You play</span><button id="deckMe" type="button">View deck</button></div><div class="picks" id="picksMe"></div></div>

<script>(function (root) {
'use strict';
const WILD = 3, MAXHP = 20, MAXTURNS = 160, INF = Infinity;
let UID = 0;
class GameOver extends Error {}

/* ---------------- Characters ---------------- */
const CHARS = {
  ragnar: { id: 'ragnar', name: 'Ragnar', title: 'The Imperial Warrior', role: 'Equipment-focused aggressor', hue: '#b8503a',
    passive: ['Imperial Mastery', 'Each equipped [Imperial] card gains +1 to its main number: weapon damage, armor reduction, or shield blocks.'],
    once: ['quick', 'Quick Re-Arm', 'Once per game. In Resolution, if one of your weapons was destroyed this turn, equip a weapon from your hand into an empty slot for free.'] },
  valthea: { id: 'valthea', name: 'Valthea', title: 'The Arcane Scholar', role: 'Resource-building spellcaster', hue: '#6a78d8',
    passive: ['Source of Power', 'Starts with a Source token: +1 Magic each Setup, until you first play a [Magic] Equipment card.'],
    once: ['recall', 'Arcane Recall', 'Once per game. Return one Action card from your discard pile to your hand.'] },
  lyra: { id: 'lyra', name: 'Lyra', title: 'The Shadowblade', role: 'Disruption, poison, multi-weapon', hue: '#3aa596',
    passive: ['Backstab', 'If the opponent has no face-down cards and no shield in play, your weapon attacks deal +1 damage.'],
    once: ['vanish', 'Vanish into Smoke', 'Once per game. During their Battle Phase, cancel their current attack and end their Battle Phase.'] },
  malakor: { id: 'malakor', name: 'Malakor', title: 'The Gravebinder', role: 'Attrition, minions, sacrifice', hue: '#93a455',
    passive: ['Soul Harvest', 'Whenever any equipped card leaves either player\'s field (destroyed, discarded or replaced), heal 1 HP.'],
    once: ['rise', 'Rise Again', 'Once per game. Equip a weapon or armor from your discard pile into a legal open slot.'] },
  gandov: { id: 'gandov', name: 'Gandov', title: 'The Grand Trickster', role: 'Deception, redirection, hand disruption', hue: '#d29a2c',
    passive: ['Hall of Mirrors', 'When an attack is absorbed by a clone, illusion or phantasm, the attacker discards 1 random card.'],
    once: ['phantasm', 'Mass Phantasm', 'Once per game. Fill every empty Wildcard slot with a Phantasm token.'] }
};

/* ---------------- Cards ---------------- */
const C = {};
const def = (id, o) => { C[id] = Object.assign({ id, tags: [] }, o); };
// Ragnar
def('cuirass', { name: 'Steel Cuirass', type: 'equip', slot: 'armor', tags: ['Imperial'], dr: 1, text: 'Armor. Reduces weapon-attack damage by 1.' });
def('broadsword', { name: 'Broadsword', type: 'equip', slot: 'main', tags: ['Imperial'], dmg: 2, dur: 2, text: 'Main weapon. 2 damage.' });

  gandov: [['robes', 2], ['staff', 2], ['triplephantasm', 3], ['mindscramble', 3], ['psychicfeedback', 2], ['spellsnatch', 3], ['misdirection', 3], ['mindfog', 2]]

/* ---------------- Helpers ---------------- */
const isWeapon = c => !!c && !c.token && c.type === 'equip' && c.dmg != null;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const nm = (g, i) => g.p[i].name;
const log = (g, msg, cls) => { const e = { turn: g.turnNo, msg, cls: cls || '' }; g.log.push(e); if (g.onLog) g.onLog(e); };
const note = (g, k) => { g.stats.rulings[k] = (g.stats.rulings[k] || 0) + 1; };
async function beat(g, ms) { if (g.render) g.render(); if (g.pace > 0 && ms > 0) await new Promise(r => setTimeout(r, ms * g.pace)); }
function checkEnd(g) {
  if (g.over) throw new GameOver();
  const a = g.p[0], b = g.p[1];
  if (a.hp <= 0 || b.hp <= 0) { g.over = true; g.winner = (a.hp <= 0 && b.hp <= 0) ? -1 : (a.hp <= 0 ? 1 : 0); throw new GameOver(); }
}
function mkCard(id, owner) { const d = C[id]; return Object.assign({}, d, { uid: ++UID, owner, faceDown: false, maxDur: d.dur }); }
function mkToken(kind, owner) {
  const base = { illusion: ['Illusion', 0, 0], phantasm: ['Phantasm', 0, 0], skeleton: ['Skeleton', 1, 1] }[kind];
  return { token: true, kind, uid: ++UID, owner, name: base[0], hp: base[1], dmg: base[2], type: 'token', tags: [] };
}
const effDmg = (p, c) => c.dmg + ((p.char === 'ragnar' && c.tags.includes('Imperial')) ? 1 : 0);
const effDR = (p, c) => { if (!c) return 0; let d = c.dr || 0; if (d > 0 && p.char === 'ragnar' && c.tags.includes('Imperial')) d += 1; return d; };
const allWeapons = p => [p.weapon, ...p.wild].filter(isWeapon);
const freeWild = p => p.wild.map((c, k) => c ? -1 : k).filter(k => k >= 0);
const wv = (p, c) => effDmg(p, c) * (c.dur === INF ? 4 : Math.min(c.dur, 4));

function newPlayer(i, char, mirror) {
  const p = { i, char, name: CHARS[char].name + (mirror ? (i === 0 ? ' (P1)' : ' (P2)') : ''), hp: MAXHP, magic: 0, deck: [], hand: [], discard: [],
    armor: null, weapon: null, wild: [null, null, null], used: {}, source: char === 'valthea', poison: null,
    nextAttackNull: false, noWeaponAttack: false, reinforce: false, tunicUsed: false, silkTrig: -1, weaponLost: false, turns: 0 };
  for (const [id, n] of DECKS[char]) for (let k = 0; k < n; k++) p.deck.push(mkCard(id, i));
  shuffle(p.deck);
  return p;
}

function newGame(o) {
  const first = o.first === 0 || o.first === 1 ? o.first : (Math.random() < 0.5 ? 0 : 1);
  const mirror = o.chars[0] === o.chars[1];
  const g = { p: [newPlayer(0, o.chars[0], mirror), newPlayer(1, o.chars[1], mirror)], ctl: o.ctl || ['ai', 'ai'], pace: o.pace == null ? 0 : o.pace,
    first, active: first, turnNo: 0, phase: 'start', plays: 0, over: false, winner: null, log: [],
    stats: { turns: 0, dmg: [0, 0], drawn: [0, 0], discarded: [0, 0], broken: [0, 0], cancelled: [0, 0], rulings: {} } };
  return g;
}

/* ---------------- Zones ---------------- */
function removeFromField(p, c) {
  if (p.armor === c) p.armor = null; else if (p.weapon === c) p.weapon = null;
  else { const k = p.wild.indexOf(c); if (k >= 0) p.wild[k] = null; }
}
function soulHarvest(g) {
  for (const q of g.p) if (q.char === 'malakor' && q.hp < MAXHP && q.hp > 0) { q.hp += 1; log(g, `Soul Harvest: ${q.name} heals 1`, 'heal'); if (g.fx) g.fx(q.i, '+1', 'heal'); }
}
function fieldDiscard(g, c) {
  if (c.token) return;
  c.faceDown = false;
  g.p[c.owner].discard.push(c); g.stats.discarded[c.owner]++;
  if (c.type === 'equip') soulHarvest(g);
}
function leaveField(g, p, c) { removeFromField(p, c); fieldDiscard(g, c); }
function discardCard(g, c) { g.p[c.owner].discard.push(c); g.stats.discarded[c.owner]++; }
function destroyCard(g, p, c) { if (isWeapon(c)) { g.stats.broken[p.i]++; p.weaponLost = true; } leaveField(g, p, c); }
function drawCards(g, i, n) {
  const p = g.p[i]; let got = 0;
  for (let k = 0; k < n; k++) {
    if (!p.deck.length) { if (p.discard.length) { p.deck = shuffle(p.discard); p.discard = []; log(g, `${p.name} shuffles their discard into a new deck`); } else break; }
    p.hand.push(p.deck.pop()); got++; g.stats.drawn[i]++;
  }
  return got;
}
function damage(g, src, tgt, n, o) {
  o = o || {}; const T = g.p[tgt];
  if (o.spell && T.armor && T.armor.id === 'robes') { n -= 1; log(g, `${T.name}'s robes soften the spell by 1`); }
  n = Math.max(0, n);
  T.hp -= n; if (src != null && src !== tgt) g.stats.dmg[src] += n;
  log(g, n > 0 ? `${o.by || 'Damage'} deals ${n} to ${T.name}` : `${o.by || 'Damage'} deals no damage to ${T.name}`, n > 0 ? 'dmg' : '');
  if (n > 0 && g.fx) g.fx(tgt, '-' + n, 'dmg');
  if (n > 0 && T.armor && T.armor.id === 'silkrobe' && T.silkTrig !== g.turnNo) {
    T.silkTrig = g.turnNo; if (drawCards(g, tgt, 1)) log(g, `${T.name}'s Silk Robe draws a card`);
  }
  return n;
}

function slotOptions(p, card) {
  const o = [];
  if (card.slot === 'armor') o.push({ id: 'armor', cur: p.armor, label: 'Armor slot' });
  if (card.slot === 'main' || card.slot === 'weapon') o.push({ id: 'main', cur: p.weapon, label: 'Main weapon slot' });
  if (card.slot === 'weapon' || card.slot === 'wild') for (let k = 0; k < WILD; k++) {
    const x = p.wild[k];
    if (!x || (!x.token && x.type === 'equip')) o.push({ id: 'w' + k, cur: x, label: 'Wildcard slot ' + (k + 1) });
  }
  return o;
}
function placeEquip(g, p, card, slot) {
  let old = null;
  if (slot === 'armor') { old = p.armor; p.armor = card; }
  else if (slot === 'main') { old = p.weapon; p.weapon = card; }
  else { const k = +slot[1]; old = p.wild[k]; p.wild[k] = card; }
  card.dur = card.maxDur; card.faceDown = false;
  if (card.shield) card.blocks = card.shield + ((p.char === 'ragnar' && card.tags.includes('Imperial')) ? 1 : 0);
  if (old) { log(g, `${card.name} replaces ${old.name}`); note(g, 'equipment replaced'); fieldDiscard(g, old); }
  if (p.source && card.tags.includes('Magic')) { p.source = false; log(g, `${p.name}'s Source of Power fades`); }
}

/* ---------------- Play legality ---------------- */
function canPlay(g, i, card, phase) {
  const p = g.p[i], o = g.p[1 - i];
  if (card.battleOnly) { if (phase !== 'battle') return false; } else if (phase !== 'setup') return false;
  if (card.cost && p.magic < card.cost) return false;
  if (card.type === 'equip') return slotOptions(p, card).length > 0;
  if (card.type === 'trap') return freeWild(p).length > 0;
  switch (card.id) {
    case 'twinstrike': return allWeapons(p).length >= 2;
    case 'mirrorclones': case 'triplephantasm': case 'skeleton': return freeWild(p).length > 0;
    case 'boneshatter': return sacrificeable(p).length > 0;
    case 'sharpoil': return allWeapons(p).some(c => c.dur !== INF && c.dur < c.maxDur);
    case 'reinforce': return !!p.armor;
    case 'lockpick': return o.hand.length > 0;
    case 'darkoffering': return p.hp > 2;
    default: return true;
  }
}
const sacrificeable = p => [p.armor, p.weapon, ...p.wild].filter(c => c && (c.token ? c.kind === 'skeleton' : c.type === 'equip'));
function abilities(g, i) {
  const p = g.p[i], a = [];
  if (p.char === 'valthea' && !p.used.recall && p.discard.some(c => c.type === 'action')) a.push('recall');
  if (p.char === 'malakor' && !p.used.rise && riseOptions(p).length) a.push('rise');
  if (p.char === 'gandov' && !p.used.phantasm && freeWild(p).length) a.push('phantasm');
  return a;
}
function emptyOptions(p, card) { return slotOptions(p, card).filter(s => !s.cur); }
function riseOptions(p) { return p.discard.filter(c => c.type === 'equip' && (isWeapon(c) || c.slot === 'armor') && emptyOptions(p, c).length); }

function legalActions(g, i) {
  const p = g.p[i], acts = [];
  if (g.phase === 'setup') {
    if (g.plays < 2) for (const c of p.hand) if (canPlay(g, i, c, 'setup')) acts.push({ type: 'play', uid: c.uid });
    for (const k of abilities(g, i)) acts.push({ type: 'ability', key: k });
    acts.push({ type: 'endSetup' });
  } else if (g.phase === 'battle') {
    if (!p.noWeaponAttack) {
      for (const w of allWeapons(p)) acts.push({ type: 'attack', uid: w.uid });
      for (const c of p.hand) if (c.id === 'twinstrike' && canPlay(g, i, c, 'battle')) acts.push({ type: 'play', uid: c.uid });
    }
    for (const t of p.wild) if (t && t.token && t.kind === 'skeleton') acts.push({ type: 'skel', uid: t.uid });
    acts.push({ type: 'endBattle' });
  }
  return acts;
}

/* ---------------- Prompts ---------------- */
async function ask(g, i, spec) {
  if (g.ctl[i] === 'ai' || !g.uiAsk) return aiAsk(g, i, spec);
  if (g.render) g.render();
  return g.uiAsk(spec);
}
const yesNo = (g, i, tag, title, text, data) => ask(g, i, { tag, title, text, data, options: [{ id: 'yes', label: 'Yes' }, { id: 'no', label: 'No' }] });
const cardVal = c => (c.type === 'equip' ? 5 : c.type === 'action' ? 4 : c.type === 'trap' ? 3 : 2) + (c.cost ? 0.5 : 0) + (c.dmg ? 1 : 0);
function aiAsk(g, i, spec) {
  const p = g.p[i], opts = spec.options;
  switch (spec.tag) {
    case 'vanish': return (spec.data.dmg >= 4 || p.hp <= 9) ? 'yes' : 'no';
    case 'parry': return spec.data.dmg >= 2 ? 'yes' : 'no';
    case 'intercept': return (spec.data.dmg >= 2 || p.hp <= 8) ? 'yes' : 'no';
    case 'grimoire': return (p.hp > 11 && p.hand.length < 5) ? 'yes' : 'no';
    case 'slot': {
      const empty = opts.filter(o => !o.cur);
      if (spec.card.slot === 'armor') return opts[0].id;
      if (spec.card.slot === 'weapon') {
        const main = opts.find(o => o.id === 'main'), wilds = opts.filter(o => o.id !== 'main');
        if (main && !main.cur) return main.id;
        const freeW = wilds.find(o => !o.cur);
        if (!main) return (freeW || wilds[0]).id;
        if (freeW && (!main.cur || wv(p, spec.card) <= wv(p, main.cur) + 1)) return freeW.id;
        if (wv(p, spec.card) > wv(p, main.cur)) return main.id;
        return freeW ? freeW.id : main.id;
      }
      if (empty.length) return empty[0].id;
      return opts.slice().sort((a, b) => cardVal(a.cur) - cardVal(b.cur))[0].id;
    }
    case 'discard': case 'fog': {
      const pickable = opts.filter(o => o.card);
      if (!pickable.length) return opts[0].id;
      return pickable.slice().sort((a, b) => cardVal(b.card) - cardVal(a.card))[0].id;
    }
    case 'bone': {
      const sk = opts.find(o => o.card && o.card.token); if (sk) return sk.id;
      return opts.slice().sort((a, b) => cardVal(a.card) - cardVal(b.card))[0].id;
    }
    case 'recall': case 'rise': case 'rearm': case 'oil': case 'staff':
      return opts.filter(o => o.card).sort((a, b) => cardVal(b.card) - cardVal(a.card))[0]?.id ?? opts[0].id;
    default: return opts[0].id;
  }
}
const pickCard = (g, i, tag, title, text, cards, extra) => ask(g, i, { tag, title, text, options: cards.map(c => ({ id: String(c.uid), label: c.name, sub: c.text, card: c })).concat(extra || []) });
async function reveal(g, i, cards, title) {
  if (g.ctl[i] === 'human' && g.uiAsk) await g.uiAsk({ tag: 'reveal', title, cards, options: [{ id: 'ok', label: 'Got it' }] });
}

/* ---------------- Card resolution ---------------- */
const ACTION = {
  async arcaneblast(g, i) { damage(g, i, 1 - i, 3, { spell: true, by: 'Arcane Blast' }); },
  async fireball(g, i) { damage(g, i, 1 - i, 5, { spell: true, by: 'Fireball Burst' }); },
  async gravespikes(g, i) { damage(g, i, 1 - i, g.p[i].discard.length >= 3 ? 3 : 2, { spell: true, by: 'Grave Spikes' }); },
  async boneshatter(g, i) {
    const p = g.p[i], items = sacrificeable(p);
    let t = items[0];
    if (items.length > 1) { const id = await pickCard(g, i, 'bone', 'Bone Shatter', 'Choose what to destroy.', items); t = items.find(c => String(c.uid) === id); }
    log(g, `${p.name} destroys ${t.name}`);
    if (t.token) removeFromField(p, t); else destroyCard(g, p, t);
    damage(g, i, 1 - i, 4, { spell: true, by: 'Bone Shatter' });
  },
  async shieldbash(g, i) { damage(g, i, 1 - i, 2, { by: 'Shield Bash' }); g.p[1 - i].nextAttackNull = true; log(g, `${g.p[1 - i].name}'s next weapon attack will deal no damage`); },
  async mirrorclones(g, i) {
    const p = g.p[i]; let n = 0;
    for (const k of freeWild(p).slice(0, 3)) { p.wild[k] = mkToken('illusion', i); n++; }
    log(g, `${p.name} creates ${n} Illusion${n > 1 ? 's' : ''}`);
  },
  async triplephantasm(g, i) {
    const p = g.p[i]; let n = 0;
    for (const k of freeWild(p)) { p.wild[k] = mkToken('phantasm', i); n++; }
    log(g, `${p.name} conjures ${n} Phantasm${n > 1 ? 's' : ''}`);
  },

    btns = `<button class="bigbtn" data-act="${act}">${t === 'play' ? 'Play ' + esc(c.name) : t === 'skel' ? 'Attack with Skeleton' : 'Attack with ' + esc(c.name)}</button>`;
  } else if (mine && zone === 'hand') btns = `<div class="note">${esc(whyNot(c, p))}</div>`;
  openSheet(`<button class="x" data-close>Close</button>${bigCardHTML(c, p)}${c.tags && c.tags.length ? `<p class="sub" style="text-align:center">[${c.tags.join('] [')}]</p>` : ''}${btns}`);
}
function charSheet(i) {
  const p = G.p[i], ch = CH[p.char], used = p.used[ch.once[0]];
  openSheet(`<button class="x" data-close>Close</button><h2>${esc(p.name)}</h2><p class="sub">${esc(ch.title)}. ${esc(ch.role)}.</p><div class="note"><b>${esc(ch.passive[0])}.</b> ${esc(ch.passive[1])}</div><div class="note"><b>${esc(ch.once[1])}</b> (${used ? 'used' : 'ready'}). ${esc(ch.once[2])}</div><div class="sub" style="margin:0">Discard pile (public)</div>${p.discard.length ? `<div class="revealrow">${p.discard.map(c => cardHTML(c, { text: true, noclick: true })).join('')}</div>` : '<p class="sub">Empty.</p>'}`);
}
document.addEventListener('click', e => {
  if (!G) return;
  const act = e.target.closest('[data-act]');
  if (act && UI.resolveAct) { const a = UI.acts[+act.dataset.act]; closeSheet(); UI.resolveAct(a); return; }
  const d = e.target.closest('[data-do]');
  if (d) { if (d.dataset.do === 'result') resultSheet(); if (d.dataset.do === 'again') startMatch(); return; }
  if (e.target.closest('#modal') || e.target.closest('#sheet')) return;
  const card = e.target.closest('[data-uid]');
  if (card) { cardSheet(+card.dataset.uid); return; }
  const pl = e.target.closest('.plate'); if (pl) charSheet(+pl.dataset.who);
});

/* ---------- result ---------- */
function reportText() {
  const s = G.stats, n = [G.p[0].name, G.p[1].name];
  const L = [`THE ARENA v0.1 match report`, `${n[0]} vs ${n[1]}. First player: ${G.p[G.first].name}.`, `Result: ${G.winner === -1 ? (G.stalemate ? 'Draw (stalemate cap)' : 'Draw') : G.p[G.winner].name + ' wins'} on turn ${s.turns}.`,
    `Final HP: ${n[0]} ${G.p[0].hp}, ${n[1]} ${G.p[1].hp}`, `Damage dealt: ${s.dmg[0]} / ${s.dmg[1]}`, `Cards drawn: ${s.drawn[0]} / ${s.drawn[1]}`, `Cards discarded: ${s.discarded[0]} / ${s.discarded[1]}`, `Weapons broken: ${s.broken[0]} / ${s.broken[1]}`, `Attacks cancelled by: ${s.cancelled[0]} / ${s.cancelled[1]}`];
  const r = Object.entries(s.rulings); L.push('Rulings invoked: ' + (r.length ? r.map(([k, v]) => `${k} x${v}`).join(', ') : 'none'));
  L.push('', 'Log:'); let t = null;
  for (const e of G.log) { if (e.turn !== t) { t = e.turn; L.push(`-- Turn ${t}`); } L.push(e.msg); }
  return L.join('\n');
}
function resultSheet() {
  if (!G) return;
  const s = G.stats, n = [G.p[0].name, G.p[1].name];
  const row = (l, a) => `<span>${l}</span><span class="n">${a[0]}</span><span class="n">${a[1]}</span>`;
  const r = Object.entries(s.rulings);
  const title = G.winner === -1 ? 'Draw' : (G.ctl[G.winner] === 'human' ? 'Victory' : (G.ctl[0] === 'human' ? 'Defeat' : G.p[G.winner].name + ' wins'));
  openSheet(`<button class="x" data-close>Close</button><h2>${title}</h2><p class="sub">${G.stalemate ? 'Stalemate cap reached. ' : ''}Turn ${s.turns}. ${esc(G.p[G.first].name)} went first.</p><div class="kv"><span class="h">Match data</span><span class="h n">${esc(n[0])}</span><span class="h n">${esc(n[1])}</span>${row('Final HP', [Math.max(0, G.p[0].hp), Math.max(0, G.p[1].hp)])}${row('Damage dealt', s.dmg)}${row('Cards drawn', s.drawn)}${row('Cards discarded', s.discarded)}${row('Weapons broken', s.broken)}${row('Attacks cancelled', s.cancelled)}</div><div class="note"><b>Rulings invoked.</b> ${r.length ? r.map(([k, v]) => `${esc(k)} x${v}`).join(', ') : 'None this match.'}</div><textarea class="rep" id="rep" readonly>${esc(reportText())}</textarea><div class="row2"><button class="ghost" id="copyRep">Copy report</button><button class="ghost" id="again2">Rematch</button></div><button class="ghost" id="toMenu">Back to menu</button>`);
  $('#again2').onclick = startMatch; $('#toMenu').onclick = leave;
  $('#copyRep').onclick = () => {
    const ta = $('#rep'), done = () => { $('#copyRep').textContent = 'Copied'; };
    const fb = () => { ta.focus(); ta.select(); $('#copyRep').textContent = 'Selected, copy it'; };
    try { navigator.clipboard.writeText(ta.value).then(done, fb); } catch (e) { fb(); }
  };
}

/* ---------- balance lab ---------- */
function labSheet() {
  openSheet(`<button class="x" data-close>Close</button><h2>Balance lab</h2><p class="sub">The built-in AI plays every matchup against itself. It is simple, so read the result as a signal, not a verdict.</p><div class="row2"><label class="sub" style="display:flex;gap:8px;align-items:center">Games per matchup <select id="labN"><option>10</option><option selected>25</option><option>50</option><option>100</option></select></label><button class="bigbtn" id="labRun" style="font-size:17px;padding:10px">Run it</button></div><div class="prog" id="labProg"><i></i></div><div id="labOut"></div>`);
  $('#labRun').onclick = async () => {
    const n = +$('#labN').value; $('#labRun').disabled = true; $('#labOut').innerHTML = '';
    const out = await A.simulate(n, (k, t) => { const pr = $('#labProg i'); if (pr) pr.style.width = (k / t * 100) + '%'; });
    if (!$('#labOut')) return;
    const ids = out.ids;
    const cell = (a, b) => { const r = out.res[a + '|' + b], t = r.w + r.l + r.d, pct = Math.round((r.w + r.d / 2) / t * 100); return `<td style="background:color-mix(in srgb, var(--good) ${pct}%, var(--bad))" title="${CH[a].name} vs ${CH[b].name}: avg ${(r.turns / t).toFixed(0)} turns">${pct}</td>`; };
    const avg = a => { let w = 0, t = 0; for (const b of ids) { const r = out.res[a + '|' + b]; w += r.w + r.d / 2; t += r.w + r.l + r.d; } return Math.round(w / t * 100); };
    $('#labOut').innerHTML = `<div class="tablewrap"><table class="mx"><tr><th class="rh">Row beats col</th>${ids.map(b => `<th>${CH[b].name.slice(0, 4)}</th>`).join('')}<th>Avg</th></tr>${ids.map(a => `<tr><th class="rh">${CH[a].name}</th>${ids.map(b => cell(a, b)).join('')}<td style="background:var(--panel2)"><b>${avg(a)}</b></td></tr>`).join('')}</table></div><div class="note">${out.games} games. First player won ${(out.firstWinRate * 100).toFixed(0)}% of decided games. Draws: ${(out.drawRate * 100).toFixed(1)}%. Cells are win % for the row character, draws counted as half. Mirror matches should sit near 50.</div>`;
    $('#labRun').disabled = false; $('#labRun').textContent = 'Run again';
  };
}

renderMenu();
})();
</script>
